name: Tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests unitaires + vérification du cache hors ligne
        run: npm test
      - name: Installer Chromium (Playwright)
        run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Parcours complet dans le navigateur
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures
          path: tests/captures
